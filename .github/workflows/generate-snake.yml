name: Refresh profile visuals

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: profile-visuals
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v6

      - name: Verify committed theme variants
        run: |
          node scripts/generate-theme-assets.mjs
          git diff --exit-code -- assets/hero-light.svg assets/stack-light.svg

      - name: Generate repository-owned stats card
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_ORGS: super-kernel
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/generate-profile-stats.mjs \
            dist/readme-tools_github-readme-stats.svg \
            dist/readme-tools_github-readme-stats-dark.svg

      - name: Generate contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/platane_grid_snake.svg
            dist/platane_grid_snake-dark.svg?palette=github-dark

      - name: Validate generated SVG files
        shell: bash
        run: |
          files=(
            dist/readme-tools_github-readme-stats.svg
            dist/readme-tools_github-readme-stats-dark.svg
            dist/platane_grid_snake.svg
            dist/platane_grid_snake-dark.svg
          )

          for file in "${files[@]}"; do
            test -s "$file"
            grep -q '<svg' "$file"
          done

          for file in dist/readme-tools_github-readme-stats*.svg; do
            grep -q 'LIVE PUBLIC ECOSYSTEM' "$file"
            ! grep -Eqi 'something went wrong|resource not accessible by integration' "$file"
          done

          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          for path in Path("dist").glob("*.svg"):
              ElementTree.parse(path)
          PY

      - name: Publish visuals to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
