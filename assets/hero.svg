<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Wheakerd — systems architect and infrastructure engineer</title>
  <desc id="description">An animated systems-interface banner with a static Wheakerd wordmark, typed specialties, and light trails around an execution model.</desc>

