<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 374" role="img" aria-labelledby="title description">
  <title id="title">Wheakerd — systems engineer and open-source builder</title>
  <desc id="description">Wheakerd. Building a more understandable tomorrow. PHP, Swoole, backend infrastructure, Linux, and developer tooling. The wordmark is always visible, the subtitle types in, and fading light trails follow the execution-model border.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050d14" />
      <stop offset="1" stop-color="#09151e" />
    </linearGradient>
    <linearGradient id="name-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc" />
      <stop offset="0.62" stop-color="#f8fafc" />
      <stop offset="1" stop-color="#73e7d3" />
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0" />
      <stop offset="0.58" stop-color="#5eead4" stop-opacity="0.22" />
      <stop offset="1" stop-color="#5eead4" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="trace-stroke" x1="0" y1="190" x2="310" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.95" />
      <stop offset="0.55" stop-color="#5eead4" stop-opacity="0.06" />
      <stop offset="1" stop-color="#73e7d3" stop-opacity="0.9" />
    </linearGradient>
    <filter id="soft-glow" x="-15%" y="-30%" width="130%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="banner-clip"><rect width="1200" height="374" rx="8" /></clipPath>
    <clipPath id="tagline-reveal" clipPathUnits="userSpaceOnUse">
      <rect x="0" y="-22" width="580" height="30">
        <animate attributeName="width" values="0;15;30;45;60;75;90;105;120;135;150;165;180;195;210;225;240;255;270;285;300;315;330;345;360;375;390;405;420;435;450;465;480;495;510;525;540;555;570;580" calcMode="discrete" dur="2.6s" begin="0s" fill="freeze" />
      </rect>
    </clipPath>
  </defs>

  <style>
    text { font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, monospace; }
    .eyebrow { fill: #b3d4df; font-size: 14px; font-weight: 500; letter-spacing: 3px; }
    .model { fill: #91d7da; font-size: 13px; letter-spacing: 2px; }
    .static-tagline { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .typed-tagline, .trace-motion { display: none; }
      .static-tagline { display: inline; }
    }
  </style>

  <rect width="1200" height="374" rx="8" fill="url(#background)" />
  <g clip-path="url(#banner-clip)" fill="none" stroke="url(#signal)" stroke-width="1">
    <path d="M550 214C735 218 813 -57 1200 52" />
    <path d="M550 219C737 221 819 -31 1200 72" />
    <path d="M550 224C750 225 819 3 1200 99" />
    <path d="M550 229C732 223 783 53 1200 221" />
    <path d="M550 234C761 213 784 308 1200 322" />
    <path d="M550 239C739 195 775 329 1200 335" />
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="372.5" rx="7.25" fill="none" stroke="#263d49" stroke-width="1.5" />

  <text class="eyebrow" x="70" y="77">SYSTEMS ENGINEER  //  OPEN SOURCE</text>
  <!-- The name is static: no reveal, opacity animation, or cursor. -->
  <text x="68" y="190" fill="url(#name-fill)" stroke="url(#name-fill)" stroke-width="1.2" paint-order="stroke" style="font-family: Inter, Arial, sans-serif" font-size="90" font-weight="900" letter-spacing="6" textLength="518" lengthAdjust="spacingAndGlyphs">WHEAKERD</text>

  <path d="M70 236h28" stroke="#5eead4" stroke-width="2.5" />
  <g transform="translate(132 240)" fill="#b3d4df" font-size="16" font-weight="500" letter-spacing="2.5">
    <text class="typed-tagline" clip-path="url(#tagline-reveal)" textLength="580" lengthAdjust="spacing">BUILDING A MORE UNDERSTANDABLE TOMORROW</text>
    <text class="static-tagline" textLength="580" lengthAdjust="spacing">BUILDING A MORE UNDERSTANDABLE TOMORROW</text>
  </g>

  <g transform="translate(838 80)">
    <path d="M0 0H310V190H0Z" fill="#07121b" fill-opacity="0.92" stroke="#263d49" />
    <!-- A fading perimeter trace, never a moving point. -->
    <g class="trace-motion" fill="none" stroke="url(#trace-stroke)" stroke-linecap="round">
      <path d="M0 0H310V190H0Z" pathLength="100" stroke-width="5" stroke-opacity="0.16" stroke-dasharray="100 100" stroke-dashoffset="100" filter="url(#soft-glow)">
        <animate attributeName="stroke-dashoffset" values="100;0;-100" keyTimes="0;0.5;1" dur="4.8s" repeatCount="indefinite" />
        <animate attributeName="stroke-opacity" values="0;0.2;0.2;0" keyTimes="0;0.08;0.9;1" dur="4.8s" repeatCount="indefinite" />
      </path>
      <path d="M0 0H310V190H0Z" pathLength="100" stroke-width="1.6" stroke-dasharray="100 100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" values="100;0;-100" keyTimes="0;0.5;1" dur="4.8s" repeatCount="indefinite" />
        <animate attributeName="stroke-opacity" values="0;0.95;0.95;0" keyTimes="0;0.08;0.9;1" dur="4.8s" repeatCount="indefinite" />
      </path>
    </g>
    <text class="eyebrow" x="32" y="36">EXECUTION MODEL</text>
    <path d="M32 56H280" stroke="#203449" stroke-opacity="0.65" />
    <g class="model">
      <text x="32" y="87">INPUT</text><text x="126" y="87">→</text><text x="173" y="87">PROCESS</text>
      <text x="32" y="122">SYSTEM</text><text x="126" y="122">→</text><text x="173" y="122">AUTOMATE</text>
      <text x="32" y="157">DELIVER</text><text x="126" y="157">→</text><text x="173" y="157">OPEN SOURCE</text>
    </g>
  </g>

  <text class="eyebrow" x="70" y="340" textLength="900" lengthAdjust="spacing">PHP  /  SWOOLE  /  BACKEND INFRASTRUCTURE  /  LINUX  /  DEVELOPER TOOLING</text>
</svg>
