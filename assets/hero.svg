  <style>
    text { font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, monospace; }
    .micro { fill: #60758a; font-size: 10px; font-weight: 650; letter-spacing: 2.2px; }
    .label { fill: #8da2b5; font-size: 11px; font-weight: 700; letter-spacing: 2.4px; }
    .rail-label { fill: #5f7488; font-size: 9px; font-weight: 700; letter-spacing: 1.8px; }
    .rail-value { fill: #c9d5df; font-size: 12px; font-weight: 650; letter-spacing: 0.8px; }
    .cursor { animation: cursor-blink 0.72s steps(1) infinite; }
    .status-dot { animation: status-pulse 2.4s ease-in-out infinite; }
    .scan-line { animation: scan-line 6s ease-in-out infinite; }
    @keyframes cursor-blink { 0%, 52% { opacity: 1; } 53%, 100% { opacity: 0; } }
    @keyframes status-pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    @keyframes scan-line { 0%, 100% { transform: translateY(-120px); opacity: 0; } 18%, 82% { opacity: 0.32; } 50% { transform: translateY(240px); opacity: 0.12; } }
  </style>

